<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>


    <style>
        body {
            background-color: #282c34;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            background: #3a3f4b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        input[type="number"] {
            width: 80%;
            padding: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
            border-radius: 4px;
            border: none;
        }

        button {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #61dafb;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        #feedback {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        #attempts {
            margin-top: 5px;
            color: #bbb;
        }

        #restartBtn {
            margin-top: 15px;
            background-color: #4caf50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="game-container">
    <h1>Guess The Number</h1>
    <p>I'm thinking of a number between 1 and 100.</p>

    <input type="number" id="guessInput" placeholder="Enter number..." min="1" max="100">
    <button id="guessBtn" onclick="checkGuess()">Guess</button>

    <div id="feedback"></div>
    <div id="attempts">Attempts: 0</div>

    <button id="restartBtn" onclick="resetGame()" style="display: none;">Play Again</button>
    </div>


    <script>
        // Generateing a random number between 2 and 100
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attemptsCount = 0;
        let guessHistory = []; // Array to store past guesses
        const inputElement = document.getElementById('guessInput'); // making the input object global
        
        function checkGuess() {
            
            const userGuess = Number(inputElement.value);
            const feedback = document.getElementById('feedback');
            const attempts = document.getElementById('attempts');

            // Input validation (condition)
            if (!userGuess || userGuess < 1 || userGuess > 100) {
                feedback.textContent = "Please enter a valid number between 1 and 100!";
                feedback.style.color = "#ff6b6b";
                return ;
            }

            // Increment attempts
            attemptsCount++;
            guessHistory.push(userGuess); // Add guess to array

            // Check the guess (conditions)
            if (userGuess === secretNumber) {
                feedback.textContent = `Correct! The number was ${secretNumber}!`;
                feedback.style.color = "#4caf50";
                endGame();

            }
            else if (userGuess > secretNumber) {
                feedback.textContent = "Too high! Try again";
                feedback.style.color = "#e5c07b";
            }
            else {
                feedback.textContent = "Too low! Try again";
                feedback.style.color = "#e5c07b";
            }



            // Update attempts text using a loop to display guess history
            let historyText = "Previous guesses: ";
            for (let i = 0; i < guessHistory.length; i++) {
                historyText += guessHistory[i] + (i < guessHistory.length - 1 ? ", " : "");
            }

            attempts.textContent = `Attempts: ${attemptsCount} | ${historyText}`;

            // Clear input field for the next guess
            inputElement.value = "";
        }

        function endGame() {
            // Disable input and ugess button when won
            document.getElementById('guessInput').disabled = true;
            document.getElementById('guessBtn').disabled = true;
            // Show restart button
            document.getElementById('restartBtn').style.display = "inline-block";
        }

        function resetGame() {
            // Reset variables
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attemptsCount = 0;
            guessHistory = [];
        


        // Reset UI elements
        document.getElementById('guessInput').disabled = false;
        document.getElementById('guessBtn').disabled = false;
        document.getElementById('guessInput').value = "";
        document.getElementById('feedback').textContent = "";
        document.getElementById('attempts').textContent = "Attempts: 0";
        document.getElementById('restartBtn').style.sisplay = "none"
        }

        // Guessing the number by preessing enter
        inputElement.addEventListener('keydown', (event) => {
            if(event.key === "Enter") {
                checkGuess();
            }
        });
    </script>
</body>
</html>
