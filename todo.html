<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>

        <style>
        * {
            border: none;
            margin: 0;          /* FIX: Changed from 'none' to '0' */
            padding: 0;         /* ADDED: Cleans default list and page spacing browser padding */
            font-family: 'Geist', monospace;
            box-sizing: border-box;
        }

        h1 {
            color: white;
            text-shadow: 0px 0px 10px rgb(0, 0, 0);
            margin-top: 40px;   /* ADDED: Pushes the title cleanly away from top of window */
            margin-bottom: 20px;/* ADDED: Separation space between title and card wrapper */
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* FIX: Changed from center to prevent content clipping on small screens */
            align-items: center;
            background-color: rgb(40, 36, 36);
            min-height: 100vh;  /* ADDED: Makes sure background canvas covers whole screen height */
        }

         .card {
            border-radius: 12px;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(0, 0, 0);
            box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.9);
            padding-bottom: 20px;

            /* ─── ADD THESE THREE LINES TO LOCK THE CARD HEIGHT ─── */
            max-height: 80vh;    /* Prevents the card from ever growing taller than 80% of the screen */
            overflow: hidden;    /* Prevents child elements from spilling out of the card borders */
        }


        /* FIX: Explicit layout bounds for input field container */
        .input-display {
            width: 100%;
            padding: 20px;
            height: 80px;       /* FIX: Gives a set track height so input's 100% height value works */
        }

        input { 
            outline: none;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            width: 100%;
            height: 100%;
            box-shadow: 0px 0px 10px grey;
            padding-left: 15px;       
            display: flex;            
            align-items: center;      
        }

        input::placeholder {
            color: gray;        /* FIX: Swapped black for gray to make placeholder readable against white background */
        }

        button {
            border-radius: 5px;
            width: 70px;
            height: 40px;
            background-color: green;
            color: white;
            font-size: 20px;
            box-shadow: 0px 0px 10px rgba(170, 166, 166, 0.9);
            cursor: pointer;
            margin-bottom: 20px; /* ADDED: Pushes input area cleanly away from task list below */
        }

        .task-display {
            width: 100%;
            padding: 0 20px;

            /* ─── ADD THESE THREE LINES TO CREATE THE SCROLL TRACK ─── */
            flex: 1;             /* Forces the task container to occupy all remaining middle area space */
            overflow-y: auto;    /* Spawns an internal vertical scrollbar automatically when tasks fill it */
            margin-bottom: 10px; /* Separation buffer space between list bottom and task counter text */
        }

         /* OPTIONAL: Custom scrollbar wrapper engine to match your application's dark aesthetic */
        .task-display::-webkit-scrollbar {
            width: 6px;
        }
        
        .task-display::-webkit-scrollbar-track {
            background: rgb(0, 0, 0);
        }

        .task-display::-webkit-scrollbar-thumb {
            background-color: rgb(70, 70, 70);
            border-radius: 10px;
        }

        .task-display::-webkit-scrollbar-thumb:hover {
            background-color: rgb(100, 100, 100);
        }

        #task-list {
            list-style-type: none;  
            padding: 0;
            margin: 0;
            width: 100%;
        }

        /* FIX: Consolidated multi-declaration target block for task element layout */
        #task-list li {
            background-color: rgb(40, 36, 36);
            color: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 1.1rem;
            word-wrap: break-word;  
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            transform: translateX(0);
        }

        #task-list li.fade-out {
            opacity: 0;
            transform: translateX(30px);  
        }

        #task-list li span {
            cursor: pointer;
            flex: 1; 
        }

        #task-list li span.completed {
            text-decoration : line-through;
            color : #888;
        }

        .delete-btn {
            background-color: rgb(190, 40, 40);
            color: white;
            border: none;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: none;  
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .delete-btn:hover {
            background-color: rgb(255, 0 ,0);
        }

        #task-counter {
            color: #bbb;
            font-size: 0.95rem;
            margin-top: 15px;
            font-family: 'Geist', monospace;
        }

        #clear-btn {
            background-color: rgb(70, 70, 70);
            color: white;
            border-radius: 5px;
            width: 120px;
            height: 40px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #clear-btn:hover {
            background-color: rgb(190, 40, 40); 
        }
    </style>

</head>







<body>
    <h1>TO-DO LIST</h1>
    <div class="card">
        <div class="input-display"> <!-- this class is used only for styling-->
            <input type="text" id="inp" placeholder="Add new task"><br><br> <!--give an id to apply javascript.-->
        </div>
    <button id="add-btn">Add</button>

    
        <div class="task-display">
            <!-- the parent list container needs an ID so JS can find it -->
            <ul id="task-list">
                <!-- the new task <li> elements will be dynamically injected here -->
            </ul>
        </div>

        <!-- task counter display -->
         <div id="task-counter">0 of 0 tasks completed</div>

        <!-- button to clear all the tasks -->
    <button id="clear-btn">Clear All</button>
    </div>
<!-- ########################################################################################################################################################################### -->
    <script>
        const taskInput = document.getElementById('inp'); // user input
        const addBtn = document.getElementById('add-btn'); // button object
        const taskList = document.getElementById('task-list'); // reference the <ul>
        const clearBtn = document.getElementById('clear-btn'); // reference clear button
        const counterDisplay = document.getElementById('task-counter'); // reference counter
// test block----------------------------------------------------------------------------
// BELOW IS ONLY FOR TEST
        // adding an eventListener to check listen for button clicks
        // addBtn.addEventListener('click', function() {
        //     let enteredText = taskInput.value;

        //     if (enteredText.trim() !== "") {
        //         console.log("saved text :", enteredText);
        //     }

        //     taskInput.value = "";
        // })
// ---------------------------------------------------------------------------



    // Load tasks on startup
    loadTasksFromStorage();

    function createNewTask() {
        let enteredText = taskInput.value;

        if (enteredText && enteredText.trim() !== "") {
            // render a fresh task as UNCOMPLETED (false) by default
            addTaskToDOM(enteredText.trim(), false);
            saveTasksToStorage();
        }
        
        // FIX: Moved outside the "if" block to guarantee the box clears 
        // even if the user typed accidental empty spaces
        taskInput.value = "";
        taskInput.focus(); // Keeps the blinking cursor ready for the next task
    }

    // HELPER FUNCTION: Accepts a 'isCompleted' status parameter
    function addTaskToDOM(text, isCompleted) {
        const newTodoItem = document.createElement('li');

        const taskTextSpan = document.createElement('span');
        taskTextSpan.textContent = text;
        
        // If the task was loaded from memory as completed, apply the class immediately
        if (isCompleted) {
            taskTextSpan.classList.add('completed');
        }

        // Add strike feature on click
        taskTextSpan.addEventListener('click', () => {
            taskTextSpan.classList.toggle('completed');
            saveTasksToStorage();  // Save updated true/false states
            updateTaskCounter(); // recalculate counter when an item is checked
        });

        newTodoItem.appendChild(taskTextSpan);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'X';
        deleteBtn.className = 'delete-btn';

        // FAde out animation logic
        deleteBtn.addEventListener('click', () => {
            // Adding the CSS class to kick off the 0.4s fade transition
            newTodoItem.classList.add('fade-out');

            // wait for 400 milliseconds for the visual animation  to finish before clearing from HTML
            setTimeout(() => {
                newTodoItem.remove();
                saveTasksToStorage();
                updateTaskCounter(); // recalculate counter after element leaves DOM
            }, 400);
        });

        

        newTodoItem.appendChild(deleteBtn);
        taskList.appendChild(newTodoItem);

        // update the counter text anytime a new item joins the DOM layout
        updateTaskCounter();
    }

    // New funciton: calculates totals and rewrites the ocutner message
    function updateTaskCounter() {
        const totalTasks = taskList.querySelectorAll('li').length;
        const completedTasks = taskList.querySelectorAll('li span.completed').length;

        counterDisplay.textContent = `${completedTasks} of ${totalTasks} tasks completed`;
    }


    // LOCAL STORAGE: Save text AND completion state as objects
    function saveTasksToStorage() {
        const tasks = [];
        const allTaskItems = taskList.querySelectorAll('li');

        allTaskItems.forEach((li) => {
            const span = li.querySelector('span');
            
           
            tasks.push({
                text: span.textContent,
                completed: span.classList.contains('completed') 
            });
        });

        localStorage.setItem('myTodoList', JSON.stringify(tasks));
    }

    // LOCAL STORAGE: Load objects back out of memory
    function loadTasksFromStorage() {
        const savedData = localStorage.getItem('myTodoList');

        if (savedData) {
            const tasks = JSON.parse(savedData);

            tasks.forEach((taskObj) => {
                addTaskToDOM(taskObj.text, taskObj.completed);
            });
        }
        updateTaskCounter(); // render initial calculation based on saved cache load
    }

    // Clear all logic
    clearBtn.addEventListener('click', () => {
        // applying fade-out class to all items together for a coll mass wipe effect
        const allItems = taskList.querySelectorAll('li');
        allItems.forEach(li => li.classList.add('fade-out'));

        setTimeout(() => {
            taskList.innerHTML = "";
            localStorage.removeItem('myTodoList');
            updateTaskCounter();
        }, 400);
        
    });

    // Event triggers
    addBtn.addEventListener('click', createNewTask);
    taskInput.addEventListener('keydown', (event) => {
        if (event.key === "Enter") {
            createNewTask();
        }
    });
    </script>

</body>
</html>
